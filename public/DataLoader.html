<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Spring 2025 Course Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="styleSheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body id="default">

    <div class="container mt-4">
        <h1 id="title"></h1>
        <p><strong>Article:</strong> <span id="article"></span></p>
        <p><strong>Concept Art:</strong></p>
        <img id="conceptArt" style="max-width: 100%; height: auto;" />
        <p><strong>World:</strong> <span id="world"></span></p>
        <p><strong>Author:</strong> <span id="author"></span></p>
    </div>

    <script>
        const raw = localStorage.getItem('viewData');
        console.log("Raw storage:", raw);

        const data = raw ? JSON.parse(raw) : null;
        console.log("Parsed data:", data);

        if (data) {
            document.getElementById('title').textContent = data.title || 'N/A';
            document.getElementById('article').textContent = data.article || 'N/A';
            document.getElementById('conceptArt').textContent = data.conceptArt || 'N/A';
            document.getElementById('world').textContent = data.world || 'N/A';
            document.getElementById('author').textContent = data.author || 'N/A';

            if (data.image) {
                document.getElementById('image').src = data.image;
            }
        }
        if (data.conceptArt) {
            document.getElementById('conceptArt').src = data.conceptArt;
        } else {
            document.getElementById('conceptArt').alt = 'No image available';
        }
    </script>

</body>

</html>
